<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星空小宇宙 · 太陽・月亮・上升 星座互動圖鑑</title>
<meta name="description" content="用互動方式探索十二星座的太陽、月亮與上升，並用 Big Three 組合器組合出你的星盤小卡。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070718; --bg2:#0e0e2b; --ink:#f1efff; --mute:#b9b6dc; --line:rgba(255,255,255,.14);
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12);
  --fire-a:#ff7a45; --fire-b:#ffc14d;
  --earth-a:#4fc47f; --earth-b:#d8b86a;
  --air-a:#52c7ff; --air-b:#b79cff;
  --water-a:#7a8cff; --water-b:#d27dff;
  --a:#b79cff; --b:#52c7ff;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","Source Han Serif TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC","Source Han Sans TC",system-ui,sans-serif;
}
[data-el="fire"]{--a:var(--fire-a);--b:var(--fire-b)}
[data-el="earth"]{--a:var(--earth-a);--b:var(--earth-b)}
[data-el="air"]{--a:var(--air-a);--b:var(--air-b)}
[data-el="water"]{--a:var(--water-a);--b:var(--water-b)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:radial-gradient(1200px 700px at 80% -10%,#2a1a5e55,transparent),radial-gradient(900px 600px at -10% 30%,#0b3a6b44,transparent),linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg));min-height:100vh;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:10px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;color:#000;padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(7,7,24,.62);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-weight:900;font-size:1.15rem;text-decoration:none;display:flex;gap:8px;align-items:center;margin-right:auto;background:none;border:0;padding:4px 0}
.logo i{font-style:normal;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:conic-gradient(from 0deg,var(--fire-a),var(--earth-a),var(--air-a),var(--water-b),var(--fire-a));color:#fff;font-size:1rem;animation:spin 14s linear infinite}
nav.top-nav{display:flex;gap:6px;flex-wrap:wrap}
.nav-btn{border:1px solid transparent;background:transparent;padding:6px 14px;border-radius:999px;text-decoration:none;font-size:.95rem;transition:.2s}
.nav-btn:hover{background:var(--glass2);border-color:var(--line)}
main{position:relative;z-index:1;max-width:1180px;margin:auto;padding:0 20px 60px}
.view{animation:viewIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(22px) scale(.99);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shimmer{to{background-position:200% center}}

/* HERO */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:center;padding:44px 0 20px;min-height:78vh}
.eyebrow{display:inline-block;padding:4px 14px;border:1px solid var(--line);border-radius:999px;background:var(--glass);font-size:.85rem;color:var(--mute);letter-spacing:.08em}
h1.title{font-family:var(--serif);font-size:clamp(2.4rem,6.4vw,4.6rem);line-height:1.12;margin:16px 0 14px;font-weight:900;background:linear-gradient(90deg,#ffd27a,#ff8aa8,#a58bff,#5ed0ff,#ffd27a);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 9s linear infinite}
.lead{font-size:1.1rem;color:var(--mute);max-width:34em;margin:0 0 26px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass);padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;transition:transform .2s,box-shadow .25s,background .2s;backdrop-filter:blur(8px)}
.btn:hover{transform:translateY(-3px);background:var(--glass2);box-shadow:0 10px 30px -8px var(--a)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.primary{background:linear-gradient(120deg,#ff9a5a,#ff5d9e 45%,#8a6bff);border-color:transparent;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.stats{display:flex;gap:22px;margin-top:28px;color:var(--mute);font-size:.9rem;flex-wrap:wrap}
.stats b{font-family:var(--serif);font-size:1.5rem;color:#fff;display:block}

/* WHEEL */
.wheel-wrap{position:relative;display:grid;place-items:center}
svg.wheel{width:min(100%,520px);height:auto;overflow:visible;filter:drop-shadow(0 0 40px rgba(130,110,255,.35))}
.ring{transform-origin:260px 260px;animation:spin 120s linear infinite}
.seg{cursor:pointer;transition:filter .2s,transform .25s;transform-origin:260px 260px;outline:none}
.seg path{transition:opacity .2s,stroke-width .2s}
.seg:hover,.seg:focus-visible{filter:brightness(1.35) drop-shadow(0 0 10px var(--a));transform:scale(1.045)}
.seg:focus-visible path{stroke:#fff;stroke-width:3}
.seg text{pointer-events:none;font-family:var(--sans)}
.wheel-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
.wc-in{width:34%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;align-content:center;background:radial-gradient(circle,rgba(20,18,60,.9),rgba(10,10,36,.55));border:1px solid var(--line);transition:.3s}
.wc-glyph{font-size:clamp(2rem,6vw,3.2rem);line-height:1;color:var(--a);transition:.3s;font-family:"Segoe UI Symbol","Noto Sans Symbols","Noto Sans Symbols 2","Apple Symbols",var(--sans)}
.wc-name{font-family:var(--serif);font-weight:900;font-size:clamp(.85rem,2.2vw,1.1rem)}
.wc-sub{font-size:.72rem;color:var(--mute)}

/* SECTION */
section.block{padding:54px 0 10px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h2.sec-t{font-family:var(--serif);font-size:clamp(1.6rem,4vw,2.3rem);margin:0;font-weight:900}
.sec-s{color:var(--mute);margin:4px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--glass);padding:7px 16px;border-radius:999px;font-weight:700;transition:.2s;font-size:.95rem}
.chip:hover{transform:translateY(-2px);background:var(--glass2)}
.chip[aria-pressed="true"]{background:linear-gradient(120deg,var(--a),var(--b));color:#10102a;border-color:transparent;box-shadow:0 6px 22px -6px var(--a)}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;perspective:1100px}
.card{--rx:0deg;--ry:0deg;position:relative;text-align:left;border:1px solid var(--line);border-radius:22px;padding:20px 18px 18px;background:linear-gradient(160deg,color-mix(in srgb,var(--a) 22%,transparent),rgba(255,255,255,.05) 55%),rgba(14,14,43,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s ease-out,box-shadow .3s,border-color .3s,opacity .35s;display:block;width:100%;min-height:228px;text-decoration:none}
.card::before{content:"";position:absolute;width:220px;height:220px;left:var(--mx,50%);top:var(--my,0%);translate:-50% -50%;background:radial-gradient(circle,var(--b),transparent 65%);opacity:0;transition:opacity .3s;mix-blend-mode:screen;pointer-events:none}
.card:hover,.card:focus-visible{border-color:var(--a);box-shadow:0 18px 44px -14px var(--a)}
.card:hover::before{opacity:.32}
.card .g{font-size:3.1rem;line-height:1;color:var(--b);filter:drop-shadow(0 0 12px var(--a));font-family:"Segoe UI Symbol","Noto Sans Symbols","Noto Sans Symbols 2","Apple Symbols",var(--sans);transition:transform .4s}
.card:hover .g{transform:scale(1.18) rotate(-8deg)}
.card h3{font-family:var(--serif);font-size:1.3rem;margin:10px 0 0;font-weight:900}
.card .en{font-size:.82rem;color:var(--mute);letter-spacing:.06em}
.card .dt{font-size:.85rem;color:var(--mute);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:.74rem;padding:2px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--a) 70%,#fff 0%);background:color-mix(in srgb,var(--a) 20%,transparent);color:#fff}
.card .kw{margin-top:12px;font-size:.84rem;color:#e4e1ff;max-height:0;opacity:0;overflow:hidden;transition:max-height .4s,opacity .4s}
.card:hover .kw,.card:focus-visible .kw{max-height:90px;opacity:1}
.card.hide{display:none}
@media (hover:none){.card .kw{max-height:90px;opacity:1}}

/* ELEMENT / MODE */
.el-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.panel{border:1px solid var(--line);border-radius:22px;padding:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--a) 16%,transparent),rgba(255,255,255,.04)),rgba(14,14,43,.55);backdrop-filter:blur(10px)}
.panel h3{margin:0 0 6px;font-family:var(--serif);font-size:1.2rem;color:var(--b)}
.panel p{margin:6px 0}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.mini button{border:1px solid var(--line);background:var(--glass);padding:3px 12px;border-radius:999px;font-size:.88rem;transition:.2s}
.mini button:hover{background:var(--a);color:#10102a}
.pc{font-size:.92rem}
.pc b{color:var(--b)}
.note{border-left:4px solid var(--b);padding:8px 14px;margin:16px 0 0;background:var(--glass);border-radius:0 12px 12px 0;color:#ddd9ff}
table.bt{width:100%;border-collapse:collapse;margin-top:6px}
.bt th,.bt td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.bt th{color:var(--mute);font-weight:500;font-size:.9rem}
.scroll-x{overflow-x:auto}
ol.pri{padding-left:1.2em;margin:6px 0}
ol.pri li{margin:8px 0}

/* DETAIL */
.crumbs{display:flex;gap:10px;align-items:center;padding:22px 0 8px;flex-wrap:wrap}
.d-hero{position:relative;border:1px solid var(--line);border-radius:30px;padding:30px 28px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 34%,transparent),color-mix(in srgb,var(--b) 10%,transparent) 60%,transparent),rgba(14,14,43,.6);backdrop-filter:blur(12px);display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.d-glyph{font-size:clamp(5rem,16vw,9rem);line-height:1;color:var(--b);filter:drop-shadow(0 0 28px var(--a));animation:floaty 5s ease-in-out infinite;font-family:"Segoe UI Symbol","Noto Sans Symbols","Noto Sans Symbols 2","Apple Symbols",var(--sans)}
.d-hero h2{font-family:var(--serif);font-size:clamp(2rem,6vw,3.4rem);margin:0;font-weight:900;line-height:1.1}
.d-hero .en{color:var(--mute);letter-spacing:.12em}
.tabs{display:flex;gap:10px;margin:22px 0 6px;flex-wrap:wrap}
.tab{flex:1 1 150px;border:1px solid var(--line);background:var(--glass);border-radius:18px;padding:12px 16px;font-weight:700;font-size:1.02rem;transition:.25s;display:flex;align-items:center;justify-content:center;gap:8px}
.tab:hover{transform:translateY(-3px);background:var(--glass2)}
.tab[aria-selected="true"]{background:linear-gradient(120deg,var(--a),var(--b));color:#10102a;border-color:transparent;box-shadow:0 10px 28px -8px var(--a)}
.tab small{font-weight:500;opacity:.8}
.tp{animation:viewIn .45s both}
.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-top:16px}
.sec{border:1px solid var(--line);border-radius:20px;padding:18px 20px;background:rgba(14,14,43,.58);backdrop-filter:blur(10px);position:relative;overflow:hidden;transition:transform .25s,border-color .25s}
.sec:hover{transform:translateY(-4px);border-color:var(--a)}
.sec.wide{grid-column:1/-1}
.sec h4{margin:0 0 6px;font-size:1rem;display:flex;gap:8px;align-items:center;color:var(--b)}
.sec h4 .ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--a) 28%,transparent);font-size:1rem}
.sec p{margin:0;white-space:pre-line}
.sec.good{border-color:color-mix(in srgb,#7dffb0 40%,transparent)}
.sec.dark{border-color:color-mix(in srgb,#ff7d9a 40%,transparent);background:rgba(30,10,35,.55)}
.sec ul{margin:6px 0 10px;padding-left:1.3em}
.kwrow{display:flex;gap:8px;flex-wrap:wrap}
.kw-chip{padding:5px 15px;border-radius:999px;font-weight:700;background:linear-gradient(120deg,color-mix(in srgb,var(--a) 55%,#000),color-mix(in srgb,var(--b) 40%,#000));border:1px solid color-mix(in srgb,var(--b) 50%,transparent);animation:pop .5s both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.sum{position:relative;border-radius:22px;padding:22px 24px;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 22%,transparent),color-mix(in srgb,var(--b) 10%,transparent));border:1px dashed var(--b);margin-top:16px}
.sum h4{margin:0 0 8px;font-family:var(--serif);font-size:1.15rem}
.sum ul{margin:6px 0 10px;padding-left:1.3em}
.sum p{margin:6px 0}
.wip{text-align:center;border:1px dashed var(--line);border-radius:22px;padding:40px 20px;color:var(--mute);margin-top:16px}
.wip .em{font-size:2.6rem;display:block;animation:floaty 3s ease-in-out infinite}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}
.pn .btn{flex:1 1 200px;justify-content:center}
.pn .btn small{display:block;color:var(--mute);font-weight:400;line-height:1.2}
.row-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}


/* CHECKLIST */
.cl-top{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-top:10px}
.ring-p{--p:0;width:112px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--a) calc(var(--p)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;position:relative;transition:background .4s;flex:none}
.ring-p::after{content:"";position:absolute;inset:10px;border-radius:50%;background:#10102c}
.ring-p b{position:relative;z-index:1;font-family:var(--serif);font-size:1.5rem}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .4s}
.cl-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}
.cl-group{margin-top:16px}
.cl-group h3{font-family:var(--serif);margin:0 0 8px;font-size:1.15rem;color:var(--b);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cl-group h3 small{font-family:var(--sans);font-weight:500;color:var(--mute);font-size:.82rem}
.cl-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(14,14,43,.58);margin:8px 0;cursor:pointer;transition:.25s;position:relative}
.cl-item:hover{border-color:var(--a);transform:translateX(4px)}
.cl-item input{position:absolute;opacity:0;pointer-events:none}
.cl-box{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--b);display:grid;place-items:center;color:transparent;font-weight:900;transition:.25s;margin-top:1px}
.cl-item input:checked + .cl-box{background:linear-gradient(120deg,var(--a),var(--b));color:#10102a;transform:rotate(360deg) scale(1.05);border-color:transparent}
.cl-item input:focus-visible + .cl-box{outline:3px solid #fff;outline-offset:3px}
.cl-item input:checked ~ .cl-tx{color:#cfcaf5}
.cl-tx{flex:1}
.cl-hint{border:1px dashed var(--line);border-radius:16px;padding:14px 16px;color:var(--mute);margin:8px 0}
.cl-tabs .tab small{font-weight:700;opacity:1;background:rgba(0,0,0,.25);padding:0 9px;border-radius:99px}
.cl-tabs .tab[aria-selected="true"] small{background:rgba(255,255,255,.4)}
@media (max-width:520px){.cl-top{grid-template-columns:1fr;justify-items:center;text-align:center}}


/* RESULT */
.rs-all{display:flex;gap:22px;align-items:center;margin-top:8px}
.rs-all>div:last-child{flex:1}
.rs-big{font-family:var(--serif);font-weight:900;font-size:clamp(3rem,10vw,4.6rem);line-height:1;color:var(--b);flex:none}
.rs-big small{font-size:.4em}
.rs-bar{height:16px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0 4px}
.rs-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .6s}
.rs-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}
.rs-rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rs-line{font-weight:700;margin-top:2px}
.rs-concl{margin-top:14px}
.rs-concl h3{font-family:var(--serif);margin:0 0 6px;color:var(--b)}
.rs-concl p{margin:6px 0}
.rs-barnum{font-size:.92rem;color:#ddd9ff;border-left:4px solid #ffd27a;padding-left:12px}
.rs-empty{text-align:center;padding:34px 20px;margin-top:10px}
@media (max-width:520px){.rs-all{flex-direction:column;text-align:center}.rs-all>div:last-child{width:100%}}


/* RESULT EXTRAS */
.rs-cmp{margin-top:6px;font-weight:700}
.rs-cmp small{display:block;font-weight:400;color:var(--mute)}
.up{color:#8dffbf}.down{color:#ffc0cc}.same{color:#e4e1ff}
.rs-badge{font-size:.85rem;font-weight:700;margin-left:6px}
.kind{margin-top:14px;border:1px solid var(--line);border-radius:22px;padding:20px 22px;background:linear-gradient(135deg,rgba(255,138,168,.16),rgba(138,107,255,.16));backdrop-filter:blur(10px)}
.kind h3{margin:0 0 6px;font-family:var(--serif)}
.kind p{margin:0}
.share-sec{margin-top:18px}
.share-card{position:relative;max-width:520px;margin:12px auto 0;border-radius:28px;padding:26px 24px 20px;overflow:hidden;color:#fff;background:radial-gradient(circle at 85% 8%,rgba(255,154,90,.35),transparent 45%),radial-gradient(circle at 10% 95%,rgba(82,199,255,.28),transparent 50%),linear-gradient(160deg,#17104a,#0b0b2b 70%);border:1px solid rgba(255,255,255,.28);box-shadow:0 20px 60px -20px rgba(138,107,255,.7)}
.share-card::before{content:"";position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1.2px 1.2px at 70% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 55%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.3px 1.3px at 55% 88%,#fff,transparent);opacity:.7;pointer-events:none}
.sc-brand{font-size:.85rem;letter-spacing:.12em;color:#d9d4ff;position:relative}
.sc-pct{font-family:var(--serif);font-weight:900;font-size:clamp(3.6rem,18vw,5.4rem);line-height:1.05;margin:6px 0 2px;background:linear-gradient(90deg,#ffd27a,#ff8aa8,#8aa0ff,#5ed0ff);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.sc-pct small{font-size:.4em}
.sc-lab{font-size:.85rem;color:#cfcaf5;position:relative}
.sc-foot{margin-top:16px;font-size:.78rem;color:#cfcaf5;position:relative;border-top:1px dashed rgba(255,255,255,.25);padding-top:10px}
.sh-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.sh-msg{text-align:center;margin-top:10px;min-height:1.4em;font-weight:700}
.sh-msg.err{color:#ffc0cc}.sh-msg.ok{color:#8dffbf}
.sh-ta{display:block;width:100%;max-width:520px;margin:10px auto 0;min-height:150px;border-radius:16px;border:1px solid var(--line);background:#12123a;color:#fff;padding:12px 14px;font:inherit;line-height:1.7}
.sh-prev{display:block;max-width:min(100%,360px);margin:14px auto 0;border-radius:18px;border:1px solid var(--line)}
.explore{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

  const i = String(t||"").indexOf("簡要總結：");

  return [t.slice(0,i).trim(), t.slice(i+5).trim()];
}
const wip = (what)=>`<div class="wip"><span class="em" aria-hidden="true">🛠️</span><b>內容整理中</b><br>${esc(what)}的資料仍在整理中，之後會補上。</div>`;
function sec(icon,title,text,cls=""){
  if(!text) return "";
  return `<article class="sec ${cls}"><h4><span class="ic" aria-hidden="true">${icon}</span>${esc(title)}</h4>${/\n/.test(text)?para(text):"<p>"+esc(text)+"</p>"}</article>`;
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200); }
function copy(text,msg){
  const done=()=>toast(msg||"已複製 ✓");
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done,()=>fb()); } else fb();
  function fb(){ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy")}catch(e){} ta.remove(); done(); }
}

/* ---------- starfield ---------- */
(function stars(){
  const c = $("#stars"), x = c.getContext("2d"); let W,H,dpr,st=[],shoot=null,mx=0,my=0;
  function size(){ dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(W*H/5500); st=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.2,z:Math.random()*.8+.2,p:Math.random()*6.28,h:[210,260,330,45][Math.floor(Math.random()*4)]})); draw(0); }
  function draw(t){
    x.clearRect(0,0,W,H);
    for(const s of st){
      const tw = reduce?.8:.55+.45*Math.sin(t/900*s.z+s.p);
      const ox = mx*s.z*14, oy = my*s.z*14;
      x.beginPath(); x.fillStyle=`hsla(${s.h},90%,88%,${tw})`; x.arc(s.x+ox,s.y+oy,s.r,0,6.283); x.fill();
    }
    if(shoot){ x.strokeStyle="rgba(255,255,255,.85)"; x.lineWidth=1.6; x.beginPath(); x.moveTo(shoot.x,shoot.y); x.lineTo(shoot.x-shoot.vx*7,shoot.y-shoot.vy*7); x.stroke(); shoot.x+=shoot.vx; shoot.y+=shoot.vy; shoot.l--; if(shoot.l<=0)shoot=null; }
    else if(!reduce && Math.random()<.004) shoot={x:Math.random()*W*.8+W*.2,y:Math.random()*H*.4,vx:-9-Math.random()*5,vy:4+Math.random()*3,l:50};
    if(!reduce) requestAnimationFrame(draw);
  }
  addEventListener("resize",size);
  addEventListener("pointermove",e=>{mx=(e.clientX/W-.5);my=(e.clientY/H-.5)},{passive:true});
  size(); if(!reduce) requestAnimationFrame(draw);
})();

/* ---------- wheel (SVG) ---------- */
function wheelSVG(){
  const cx=260, cy=260, R=250, r=140, n=12; let seg="", ticks="";
  const pt=(rad,a)=>[cx+rad*Math.cos(a), cy+rad*Math.sin(a)];
  S.forEach((s,i)=>{
    const a0=(i*30-90-15)*Math.PI/180, a1=((i+1)*30-90-15)*Math.PI/180, am=(a0+a1)/2, gap=.012;
    const [x0,y0]=pt(R,a0+gap),[x1,y1]=pt(R,a1-gap),[x2,y2]=pt(r,a1-gap),[x3,y3]=pt(r,a0+gap);
    const [gx,gy]=pt((R+r)/2+6,am), [nx,ny]=pt((R+r)/2-30,am);
    const e=EL[s.element];
    seg+=`<g class="seg" data-el="${e}" data-slug="${s.slug}" tabindex="0" role="link" aria-label="${esc(s.zh)} ${esc(s.dates)}">
      <path d="M${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 0 0 ${x3} ${y3}Z" fill="url(#g-${e})" stroke="rgba(255,255,255,.35)" stroke-width="1.2" opacity=".92"/>
      <text x="${gx}" y="${gy}" text-anchor="middle" dominant-baseline="central" font-size="34" fill="#fff" style="font-family:'Segoe UI Symbol','Noto Sans Symbols','Noto Sans Symbols 2','Apple Symbols',sans-serif">${s.glyph}</text>
      <text x="${nx}" y="${ny}" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#fff" style="paint-order:stroke;stroke:rgba(0,0,0,.4);stroke-width:3px">${esc(s.zh.replace("座",""))}</text>
    </g>`;
  });
  for(let i=0;i<72;i++){ const a=(i*5)*Math.PI/180, [ax,ay]=pt(R+8,a), [bx,by]=pt(R+(i%6===0?24:15),a); ticks+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="rgba(255,255,255,${i%6===0?.7:.3})" stroke-width="${i%6===0?2:1}"/>`; }
  const grad=(e,a,b)=>`<linearGradient id="g-${e}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--${e}-a)"/><stop offset="1" stop-color="var(--${e}-b)" stop-opacity=".75"/></linearGradient>`;
  return `<svg class="wheel" viewBox="-30 -30 580 580" role="group" aria-label="十二星座星盤，點擊任何一格進入該星座">
    <defs>${grad("fire")}${grad("earth")}${grad("air")}${grad("water")}</defs>
    <g class="ring">${ticks}<circle cx="${cx}" cy="${cy}" r="${R+30}" fill="none" stroke="rgba(255,255,255,.2)" stroke-dasharray="2 8"/></g>
    ${seg}
    <circle cx="${cx}" cy="${cy}" r="${r-8}" fill="none" stroke="rgba(255,255,255,.25)" stroke-dasharray="4 6"/>
  </svg>`;
}

const isObj=o=>o&&typeof o==="object"&&!Array.isArray(o);
function clFresh(){ return {v:2,c:{},p:{},snap:null,prev:null}; }

function normSnap(o){ // validates a stored result snapshot; returns null if anything is off
  if(!isObj(o)||!isObj(o.l)) return null;
  const num=x=>typeof x==="number"&&isFinite(x)&&x>=0&&x<=100;
  if(!(typeof o.t==="number"&&isFinite(o.t)&&o.t>0)||!num(o.o)) return null;
  const l={}; for(const k of LAYER_KEYS){ if(!num(o.l[k])) return null; l[k]=Math.round(o.l[k]); }
  return {t:Math.floor(o.t),o:Math.round(o.o),l};
}
function clNormalize(o){ // accepts current or older formats; unknown/old keys (n,t,r) are dropped

const DAY_MS=24*60*60*1000;
function sameSnap(a,b){ return !!(a&&b&&a.o===b.o&&a.l.sun===b.l.sun&&a.l.moon===b.l.moon&&a.l.rising===b.l.rising); }
function deltaTxt(d){ return d>0?`+${d}%`:d<0?`-${Math.abs(d)}%`:"±0%"; }
function deltaCls(d){ return d>0?"up":d<0?"down":"same"; }

/* snapshot logic: returns {base, first}; saves only when numbers changed or the old snapshot is over a day old */
function clSnapshot(st,cur){
  try{
    const snap=st.snap, prev=st.prev;
    if(!snap){ st.snap=cur; st.prev=null; clSave(st); return {base:null,first:true}; }
    if(!sameSnap(snap,cur)){ st.prev=snap; st.snap=cur; clSave(st); return {base:snap,first:false}; }
    if(cur.t-snap.t>DAY_MS||snap.t>cur.t+DAY_MS){ st.prev=snap; st.snap=cur; clSave(st); return {base:snap,first:false}; }
    return {base:prev||null,first:false,unchanged:true};
  }catch(e){ return {base:null,first:true}; }
}

function wrapLines(ctx,text,maxW){
  const out=[]; let line="";
  for(const ch of String(text)){ const test=line+ch; if(ctx.measureText(test).width>maxW&&line){ out.push(line); line=ch; } else line=test; }
  if(line) out.push(line); return out;
}

    if(opts.length) cand.push({k:"sun",s:rPick(opts)()});
  }
  if(moonI.s&&moonI.s.moon){ let n=firstSent(moonI.s.moon.need).split("，")[0]; if(n.indexOf("需要")===0){ n=n.split("、").slice(0,2).map(z=>z.replace(/^以及/,"")).join("、"); if(n.length<=40) cand.push({k:"moon",s:rPick(PS.moon)(n)}); } }
  if(risI.s&&risI.s.rising){ const x=firstSent(risI.s.rising.first).split("，")[0]; if(x&&x.length<=30) cand.push({k:"rising",s:rPick(PS.rising)(x)}); }
  if(info.elems.length){
    const names=info.elems.map(e=>e+"象"), E=names.length>1?names.slice(0,-1).join("、")+"與"+names[names.length-1]:names[0], per=info.elems.length>1?1:3;
    const tr=info.elems.flatMap(e=>{ const g=G.elements.find(z=>z.key===e); return g?sampleN(listOf(g.desc),per):[]; });
    if(tr.length) cand.push({k:"elem",s:rPick(info.elems.length>1?PS.elemMix:PS.elem)(E,tr.join("、"))});
  }
  let picked=cand;
  if(cand.length>3){ const drop=rPick(cand.filter(c=>c.k!=="sun")); picked=cand.filter(c=>c!==drop); }
  if(Math.random()<.35) picked=sampleN(picked,picked.length);
  const sents=picked.map(c=>c.s);
  if(!sents.length) sents.push(rPick(PS.none));
  sents.push(rPick(PS.tier[tierKey(pct)]), rPick(PS.closing));
  return sents.join("");
}
function genSummary(info,pct){
  let s,tries=0; do{ s=genPersonality(info,pct); tries++; } while(s===lastSumText&&tries<10);
  lastSumText=s; return s;
}

function viewChecklistResult(){
  const st=clLoad();
  const pick=k=>(typeof st.p[k]==="string"&&bySlug[st.p[k]])?st.p[k]:"";
  let all=0,done=0; const rows=CL_LAYERS.map(l=>{
    const slug=pick(l.k), it=clItems(l.k,slug,pick("sun"))||[]; let a=0,c=0;
    it.forEach(g=>g.entries.forEach(e=>{a++; if(st.c[e.id])c++;}));
    all+=a; done+=c; return {l,slug,a,c,pct:a?Math.round(c/a*100):0};
  });
  const pct=all?Math.round(done/all*100):0;
  const kind=`<div class="kind"><h3>💌 給你的一句話</h3><p>占星是一種自我反思的工具，而不是定論。即使相似度偏低，也不代表你「不像」自己的星座，更不代表你有任何問題——這些描述本來就無法適合每一個人。</p></div>`;
  const explore=`<h3 style="font-family:var(--serif);margin:26px 0 0">🧭 探索更多</h3>
    <div class="explore"><a class="btn" href="#/mix">🎴 Big Three 組合器</a><a class="btn" href="#signs">🪐 瀏覽其他星座</a><a class="btn" href="#/elements">🔥 元素與模式</a></div>`;
  const head=`<div class="crumbs"><a class="btn" href="#/checklist">← 回到清單</a></div>
    <section class="block" style="padding-top:14px"><h2 class="sec-t">📊 觀察結果</h2>
    <p class="sec-s">以下是你勾選項目的相似度摘要，僅供自我反思參考。</p>`;
  let body, info=null;
  if(done===0){
    body=`<div class="panel rs-empty"><div style="font-size:2.6rem" aria-hidden="true">🔭</div>
      <h3 style="font-family:var(--serif);margin:6px 0">目前還沒有勾選任何項目</h3>
      <p class="sec-s">先到清單看看哪些描述符合你近期的觀察，再回來查看結果。</p>
      <a class="btn primary" href="#/checklist">前往清單開始觀察 →</a></div>${kind}${explore}`;
  } else {
    const tier=clTiers(pct);
    info=buildShareInfo(rows,pct,tier,pick);
    const cur={t:Date.now(),o:pct,l:{sun:rows[0].pct,moon:rows[1].pct,rising:rows[2].pct}};
    const snap=clSnapshot(st,cur), base=snap.base;
    let cmp;
    if(snap.first) cmp=`<div class="rs-cmp same">這是你第一次查看結果，下次會與這次對照。</div>`;
    else if(!base) cmp=`<div class="rs-cmp same">與上次查看的結果相同。</div>`;
    else { const d=pct-base.o; cmp=`<div class="rs-cmp ${deltaCls(d)}">${d===0?"與上次相同（±0%）":`比上次 ${deltaTxt(d)}`}<small>上次：${base.o}%${fmtTime(base.t)?`　${fmtTime(base.t)}`:""}。變化只反映近期勾選的差異，不代表好壞。</small></div>`; }
    const badge=(r,i)=>{ if(!base) return ""; const d=r.pct-base.l[LAYER_KEYS[i]]; return `<span class="rs-badge ${deltaCls(d)}">${d===0?"±0%":deltaTxt(d)}</span>`; };
    body=`<div class="panel rs-all"><div class="rs-big" aria-label="整體相似度 ${pct}%">${pct}<small>%</small></div>
        <div><b>整體相似度</b><div class="sec-s" style="margin:0">符合 ${done} / ${all} 項</div>
        <div class="rs-bar" role="img" aria-label="整體相似度 ${pct}%"><i style="width:${pct}%"></i></div>${cmp}</div></div>
      <div class="rs-rows">${rows.map((r,i)=>`<div class="panel rs-row" ${r.slug?`data-el="${EL[bySlug[r.slug].element]}"`:""}>
        <div class="rs-rh"><b>${r.l.icon} ${r.l.name}</b><span class="sec-s" style="margin:0">${r.slug?esc(bySlug[r.slug].glyph+" "+bySlug[r.slug].zh):"通用（未指定星座）"}</span></div>
        <div class="rs-bar" role="img" aria-label="${r.l.name}相似度 ${r.pct}%"><i style="width:${r.pct}%"></i></div>
        <div class="rs-line">${r.a?`符合 ${r.c} / ${r.a} 項（${r.pct}%）`:"尚無項目"}${badge(r,i)}</div></div>`).join("")}</div>
      <div class="panel rs-concl"><h3>${tier.icon} 結論：${esc(tier.name)}</h3><p>${esc(tier.txt)}</p>
        <p class="rs-barnum">🧠 提醒：根據巴納姆效應，寬泛的描述容易讓幾乎任何人都覺得貼合自己，因此這個數字僅供自我反思參考，不能用來證明星座描述準確。</p></div>
      <div class="panel sum-sec" id="sum-sec"><div class="rs-rh"><h3 style="font-family:var(--serif);margin:0">🌟 個人化總結</h3><button class="chip" type="button" id="sum-again">🔄 換一種說法</button></div>
        <div id="sum-box" class="sum-box" aria-live="polite"></div>
        <p class="sum-note">此段文字由頁面根據你選擇的星座與整體相似度，在你的瀏覽器中自動組合，每次的說法會略有不同，僅供自我反思參考，不是預測。</p></div>
      <div class="share-sec"><h3 style="font-family:var(--serif);margin:0">🎁 分享卡片</h3>
        ${shareCardHTML(info)}
        <div class="sh-acts"><button class="btn primary" type="button" id="sh-copy">📋 複製分享文字</button><button class="btn" type="button" id="sh-dl">🖼️ 下載結果圖</button></div>
        <div class="sh-msg" id="sh-msg" role="status" aria-live="polite"></div>
        <p class="sh-hint">分享時會附上一句邀請語：「${esc(info.invite)}」</p>
        <div id="sh-extra"></div></div>
      ${kind}${explore}
      <div class="row-act"><a class="btn primary" href="#/checklist">繼續觀察 →</a></div>`;
  }
  app.innerHTML=`<div class="view" id="rs-root">${head}${body}</section></div>`;
  document.title="觀察結果 · 星空小宇宙";
  if(!info) return;

  function renderSummary(){
    const box=$("#sum-box"); if(!box) return;
    let s; try{ s=genSummary(info,pct); }catch(e){ s="目前無法產生個人化總結，請稍後再試，或直接參考上方的結果與結論。"; }
    box.innerHTML=`<p>${esc(s)}</p>`;
    box.style.animation="none"; void box.offsetWidth; box.style.animation="";
  }
  renderSummary(); $("#sum-again").addEventListener("click",renderSummary);
  const msg=(txt,cls)=>{ const m=$("#sh-msg"); if(m){ m.textContent=txt; m.className="sh-msg "+(cls||""); } };
  function showTextarea(note){
    const ex=$("#sh-extra"); ex.innerHTML=`<textarea class="sh-ta" id="sh-ta" readonly aria-label="分享文字（可選取後手動複製）"></textarea>`;
    const ta=$("#sh-ta"); ta.value=info.text; ta.focus(); ta.select(); try{ ta.setSelectionRange(0,ta.value.length); }catch(e){}
    msg(note||"無法自動複製，請長按或選取下方文字後手動複製。","err");
  }
  $("#sh-copy").addEventListener("click",()=>{
    const done=()=>{ msg("已複製分享文字 ✓","ok"); toast("已複製分享文字 ✓"); const ex=$("#sh-extra"); if(ex) ex.innerHTML=""; };
    const legacy=()=>{
      let okc=false;
      try{ const ta=document.createElement("textarea"); ta.value=info.text; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;left:0;top:0;opacity:0;"; document.body.appendChild(ta); ta.select(); try{ta.setSelectionRange(0,ta.value.length);}catch(e){} okc=!!document.execCommand("copy"); ta.remove(); }catch(e){ okc=false; }
      if(okc) done(); else showTextarea();
    };
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){ navigator.clipboard.writeText(info.text).then(done,legacy); }
      else legacy();
    }catch(e){ legacy(); }
  });
  $("#sh-dl").addEventListener("click",()=>{
    msg("正在產生圖片……");
    const fin=()=>{
      let canvas; try{ canvas=drawShareCanvas(info); }catch(e){ msg("無法產生圖片，請改用「複製分享文字」或直接截圖保存。","err"); return; }
      const name=`星座觀察結果-${new Date().getFullYear()}${pad2(new Date().getMonth()+1)}${pad2(new Date().getDate())}.png`;
      let dataUrl=""; try{ dataUrl=canvas.toDataURL("image/png"); }catch(e){}
      const preview=()=>{ if(dataUrl){ $("#sh-extra").innerHTML=`<img class="sh-prev" alt="分享結果圖預覽" src="${dataUrl}">`; } };
      const trigger=(href)=>{ try{ const a=document.createElement("a"); a.href=href; a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); return true; }catch(e){ return false; } };
      const isMobile=(()=>{ try{ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)||(window.matchMedia&&matchMedia("(pointer:coarse)").matches&&innerWidth<900); }catch(e){ return false; } })();
      if(isMobile&&dataUrl){
        // 手機：不強制下載成檔案，改為顯示可長按儲存的圖片，並提供系統分享（可選「儲存圖片」存到相簿）
        const show=(blob)=>{
          const canShare=!!(blob&&navigator.share&&navigator.canShare&&(()=>{ try{ return navigator.canShare({files:[new File([blob],name,{type:"image/png"})]}); }catch(e){ return false; } })());
          $("#sh-extra").innerHTML=`<img class="sh-prev" alt="分享結果圖，長按可儲存圖片" src="${dataUrl}">`+(canShare?`<div class="sh-acts" style="justify-content:center;margin-top:12px"><button class="btn primary" type="button" id="sh-save">📲 儲存圖片／分享</button></div>`:"");
          if(canShare){ $("#sh-save").addEventListener("click",()=>{ try{ navigator.share({files:[new File([blob],name,{type:"image/png"})]}).catch(()=>{}); }catch(e){} }); }
          msg(canShare?"請按「儲存圖片／分享」，在選單中選「儲存圖片」；也可以長按下方圖片，選「儲存圖片」或「加入照片」。":"請長按下方圖片，選擇「儲存圖片」或「加入照片」，即可存到相簿。","ok");
        };
        try{ canvas.toBlob(b=>show(b),"image/png"); }catch(e){ show(null); }
        return;
      }
      try{
        canvas.toBlob(blob=>{
          let started=false;
          if(blob){ try{ const u=URL.createObjectURL(blob); started=trigger(u); setTimeout(()=>{try{URL.revokeObjectURL(u)}catch(e){}},8000); }catch(e){} }
          if(!started&&dataUrl) started=trigger(dataUrl);
          if(started||dataUrl){ preview(); msg(started?"已開始下載結果圖 ✓　若沒有自動下載，請長按下方圖片儲存。":"請長按下方圖片儲存。", started?"ok":""); }
          else msg("無法產生圖片，請改用「複製分享文字」或直接截圖保存。","err");
        },"image/png");
      }catch(e){
        if(dataUrl&&trigger(dataUrl)){ preview(); msg("已開始下載結果圖 ✓　若沒有自動下載，請長按下方圖片儲存。","ok"); }
        else if(dataUrl){ preview(); msg("請長按下方圖片儲存。",""); }
        else msg("無法產生圖片，請改用「複製分享文字」或直接截圖保存。","err");
      }
    };
    try{ if(document.fonts&&document.fonts.ready){ Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1200))]).then(fin,fin); } else fin(); }catch(e){ fin(); }
  });
}
/* ---------- routing ---------- */
function go(h){ if(location.hash===h) route(); else location.hash=h; }
function randomSign(){ const s=S[Math.floor(Math.random()*12)]; go("#/"+s.slug); toast("🎲 抽到："+s.zh); }
$("#rand").addEventListener("click",randomSign);
function route(){
  const parts=(location.hash||"#/").replace(/^#\/?/,"").split("/").filter(Boolean);
  document.title="星空小宇宙 · 太陽・月亮・上升 星座互動圖鑑";
  let nav="home";
  if(!parts.length || parts[0]==="signs") { viewHome(); }
  else if(parts[0]==="mix"){ nav="mix"; viewMix(parts.slice(1).map(x=>x==="_"?null:x)); }
  else if(parts[0]==="elements"){ nav="elements"; viewElements(); }
  else if(parts[0]==="checklist" && parts[1]==="result"){ nav="checklist"; viewChecklistResult(); }
  else if(parts[0]==="checklist"){ nav="checklist"; viewChecklist(parts.slice(1)); }
  else if(bySlug[parts[0]]){ nav=""; viewSign(parts[0],parts[1]); }
  else { viewHome(); }
  $$("[data-nav]").forEach(a=>{ if(a.dataset.nav===nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(!(location.hash==="#signs")) scrollTo({top:0,behavior:"auto"});
  if(location.hash && !/^#\//.test(location.hash) && $(location.hash)) $(location.hash).scrollIntoView();
}
addEventListener("hashchange",()=>{ if(skipHash){ skipHash=false; return; } route(); });
addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,select,textarea")) return;
  const parts=(location.hash||"").replace(/^#\/?/,"").split("/");
  if(bySlug[parts[0]]&&(e.key==="ArrowLeft"||e.key==="ArrowRight")&&!e.target.closest('[role="tablist"]')){
    const i=idx(parts[0]); go("#/"+S[(i+(e.key==="ArrowRight"?1:11))%12].slug);
  }
});
route();
})();
</script>
